name: Mostra CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout del código
      uses: actions/checkout@v4

  
    - name: Configurar .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 
    
    - name: Restore
      run: dotnet restore Mostra.slnx

   
    - name: Compilar solución
      run: dotnet build Mostra.slnx --configuration Release --no-restore

    
    - name: Ejecutar pruebas unitarias
      run: dotnet test Mostra.slnx --configuration Release --no-build --verbosity normal