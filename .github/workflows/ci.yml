name: Mostra CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout del código
      uses: actions/checkout@v4

  
    - name: Configurar .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Ajusta a la versión de .NET que use Mostra

    
    - name: Restaurar dependencias
      run: dotnet restore Mostra.sln

   
    - name: Compilar solución
      run: dotnet build Mostra.sln --configuration Release --no-restore

    
    - name: Ejecutar pruebas unitarias
      run: dotnet test Mostra.sln --configuration Release --no-build --verbosity normal